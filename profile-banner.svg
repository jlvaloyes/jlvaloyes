<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">John Leiver Valoyes - QA Automation hacia Data Analytics</title>
  <desc id="desc">Banner profesional azul y verde con elementos de validación, datos y visualización.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.52" stop-color="#123b56"/>
      <stop offset="1" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="320" rx="24" fill="url(#bg)"/>
  <circle cx="1110" cy="-5" r="210" fill="#2dd4bf" opacity="0.08"/>
  <circle cx="55" cy="340" r="180" fill="#38bdf8" opacity="0.08"/>

  <g opacity="0.18" stroke="#cbd5e1" stroke-width="1">
    <path d="M0 65H1200M0 130H1200M0 195H1200M0 260H1200"/>
    <path d="M150 0V320M300 0V320M450 0V320M600 0V320M750 0V320M900 0V320M1050 0V320"/>
  </g>

  <g transform="translate(70 62)" filter="url(#shadow)">
    <rect width="128" height="128" rx="28" fill="#0b2538" stroke="#38bdf8" stroke-width="2"/>
    <path d="M32 91V72h16v19zm25 0V47h16v44zm25 0V30h16v61z" fill="url(#accent)"/>
    <path d="M29 103h72" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <circle cx="102" cy="37" r="17" fill="#0f766e" stroke="#ccfbf1" stroke-width="3"/>
    <path d="m94 37 6 6 11-13" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <g transform="translate(240 72)" font-family="Segoe UI, Arial, sans-serif">
    <text x="0" y="42" fill="#f8fafc" font-size="43" font-weight="700">JOHN LEIVER VALOYES</text>
    <rect x="0" y="60" width="670" height="4" rx="2" fill="url(#accent)"/>
    <text x="0" y="104" fill="#bae6fd" font-size="25" font-weight="600">QA Automation → Data Analytics</text>
    <text x="0" y="143" fill="#e2e8f0" font-size="19">Calidad de datos · Validación · Trazabilidad · Análisis</text>
    <text x="0" y="180" fill="#94a3b8" font-size="16">Analista de Datos Junior en formación</text>
  </g>

  <g transform="translate(1010 213)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 45 34 12l34 20 44-52" stroke="#2dd4bf" stroke-width="6"/>
    <circle cx="0" cy="45" r="7" fill="#38bdf8" stroke="none"/>
    <circle cx="34" cy="12" r="7" fill="#38bdf8" stroke="none"/>
    <circle cx="68" cy="32" r="7" fill="#38bdf8" stroke="none"/>
    <circle cx="112" cy="-20" r="7" fill="#2dd4bf" stroke="none"/>
  </g>
</svg>
